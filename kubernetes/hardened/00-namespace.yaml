# Dedicated namespace with the built-in Pod Security Admission set to "restricted".
# PSA is a free, always-available second layer that does not depend on Kyverno being installed.
apiVersion: v1
kind: Namespace
metadata:
  name: assessment
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
