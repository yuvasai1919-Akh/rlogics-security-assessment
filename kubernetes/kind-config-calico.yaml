# Use this ONLY if the default CNI does not enforce NetworkPolicy.
#   kind create cluster --name rlogics-lab --config kubernetes/kind-config-calico.yaml
# then install a policy-enforcing CNI (e.g. Calico or Cilium) following ITS CURRENT docs, and wait
# for the nodes to become Ready. Nodes stay NotReady until a CNI is installed.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
