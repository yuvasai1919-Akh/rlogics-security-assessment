# GitHub Actions version of the local pipeline. UNTESTED in CI until you run it - adjust to your repo.
# Production notes: pin every action and image by SHA/digest, use a reusable workflow so hundreds of
# repos inherit one policy, and run with least-privilege tokens (permissions block per job).
name: devsecops

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF (code scanning on private repos needs GitHub Advanced Security)
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/repo" -w /repo semgrep/semgrep \
            semgrep scan --config p/python --config devsecops/sast/rules --metrics=off \
            --severity ERROR --error --sarif-output out/semgrep.sarif \
            devsecops/app-or-lab-target
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true   # fails on private repos without GHAS; artifact upload below still works
        with:
          sarif_file: out/semgrep.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: semgrep, path: out/ }

  sca-and-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plant synthetic secret (lab)
        run: bash scripts/plant_demo_secret.sh
      - name: Trivy source scan
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig --format json --output out/trivy-fs.json \
            devsecops/app-or-lab-target
      - name: Policy gate (fs)
        run: |
          python3 scripts/scan_gate.py --trivy out/trivy-fs.json --fail-on HIGH --only-fixable \
            --markdown out/gate-fs.md --csv out/gate-fs.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build image
        run: docker build -t lab-app:ci devsecops/app-or-lab-target
      - name: Trivy image scan + SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" -w /repo \
            aquasec/trivy:latest image --format json --output out/trivy-image.json lab-app:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" -w /repo \
            aquasec/trivy:latest image --format cyclonedx --output out/sbom.cdx.json lab-app:ci
      - name: Policy gate (image)
        run: python3 scripts/scan_gate.py --trivy out/trivy-image.json --fail-on HIGH --only-fixable --markdown out/gate-image.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: scan-evidence, path: out/ }

  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start lab app (runner-local only)
        run: |
          docker network create lab-net
          docker build -t lab-app:ci devsecops/app-or-lab-target
          docker run -d --name lab-app --network lab-net lab-app:ci
          sleep 5
      - name: ZAP baseline (passive) against the lab container only
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --network lab-net -v "$PWD/out:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://lab-app:8000 -J zap-baseline.json -r zap-baseline.html || [ $? -eq 2 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: zap, path: out/ }

  # Keyless signing + SBOM attestation. Runs only on main after the checks above succeed.
  sign-and-attest:
    needs: [sast, sca-and-image, dast]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # OIDC token for keyless signing (Fulcio)
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Build and push to GHCR
        id: build
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/lab-app"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:${GITHUB_SHA}" devsecops/remediated
          docker push "$IMAGE:${GITHUB_SHA}"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${GITHUB_SHA}")"
          echo "ref=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Sign by digest (keyless)
        run: cosign sign --yes "${{ steps.build.outputs.ref }}"
      - name: Verify (what admission would do)
        run: |
          cosign verify "${{ steps.build.outputs.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/devsecops\.yml@refs/heads/main$"
