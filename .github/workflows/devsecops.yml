# CI release workflow: enforce security gates on the remediated application.
# The intentionally vulnerable app remains available for local negative-test exercises.
name: devsecops

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (remediated application)
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/repo" -w /repo semgrep/semgrep \
            semgrep scan --config p/python --config devsecops/sast/rules --metrics=off \
            --severity ERROR --error --sarif-output out/semgrep.sarif \
            devsecops/remediated
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: out/semgrep.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep
          path: out/

  sca-and-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy source scan (remediated application)
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig --format json --output out/trivy-fs.json \
            devsecops/remediated
      - name: Policy gate (filesystem)
        run: |
          python3 scripts/scan_gate.py --trivy out/trivy-fs.json --fail-on HIGH --only-fixable \
            --markdown out/gate-fs.md --csv out/gate-fs.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build remediated image
        run: docker build --pull -t lab-app:ci devsecops/remediated
      - name: Trivy image scan and SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" -w /repo \
            aquasec/trivy:latest image --scanners vuln,secret --format json --output out/trivy-image.json lab-app:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" -w /repo \
            aquasec/trivy:latest image --format cyclonedx --output out/sbom.cdx.json lab-app:ci
      - name: Policy gate (image)
        run: |
          python3 scripts/scan_gate.py --trivy out/trivy-image.json --fail-on HIGH --only-fixable \
            --markdown out/gate-image.md --csv out/gate-image.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-evidence
          path: out/

  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start remediated lab app
        run: |
          docker network create lab-net
          docker build --pull -t lab-app:ci devsecops/remediated
          docker run -d --name lab-app --network lab-net lab-app:ci
          sleep 5
      - name: ZAP baseline (passive) against remediated app
        run: |
          mkdir -p out && chmod 777 out
          set +e
          docker run --rm --network lab-net -v "$PWD/out:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://lab-app:8000 -J zap-baseline.json -r zap-baseline.html
          zap_status=$?
          echo "ZAP baseline exit code: $zap_status"
          # zap-baseline exit codes: 0=pass, 1=FAIL alerts, 2=WARN alerts only, 3=ZAP error
          if [ "$zap_status" -eq 2 ]; then
            echo "ZAP completed with warnings only."
            exit 0
          fi
          exit "$zap_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap
          path: out/

  # Keyless signing is attempted only after the release-candidate security jobs pass on main.
  sign-and-attest:
    needs: [sast, sca-and-image, dast]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Build and push remediated image to GHCR
        id: build
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/lab-app"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker build --pull -t "$IMAGE:${GITHUB_SHA}" devsecops/remediated
          docker push "$IMAGE:${GITHUB_SHA}"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${GITHUB_SHA}")"
          test -n "$DIGEST"
          echo "ref=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Sign by digest (keyless)
        run: cosign sign --yes "${{ steps.build.outputs.ref }}"
      - name: Verify signature identity
        run: |
          cosign verify "${{ steps.build.outputs.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/devsecops\.yml@refs/heads/main$"
